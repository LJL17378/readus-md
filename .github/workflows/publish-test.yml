name: Publish Readus test package

on:
  workflow_dispatch:
    inputs:
      development_run:
        description: 'Successful Readus development run for this exact commit'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: readus-test-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      DEVELOPMENT_RUN: ${{ inputs.development_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify successful build and publish prerelease
        run: python3 tools/dev/publish.py
